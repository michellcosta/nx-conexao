<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ligar na TV · Saimo TV</title>
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Mande Xtream ou M3U da sua conta para a TV pelo QR da Saimo TV.">
  <link rel="icon" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #f1f1f1;
      --muted: rgba(255,255,255,.62);
      --teal: #4fe3d0;
      --card: #141414;
      --line: rgba(255,255,255,.1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 96px;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background:
        radial-gradient(1200px 520px at 50% -10%, rgba(79,227,208,.16), transparent 55%),
        linear-gradient(180deg, #121212 0%, #0a0a0a 38%);
      pointer-events: none; z-index: 0;
    }
    .wrap { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 88px 18px 24px; }
    .barra-topo {
      z-index: 20;
      background: rgba(20, 22, 38, .72);
      backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      border-radius: 26px;
      align-items: center;
      gap: 12px;
      width: min(520px, calc(100vw - 24px));
      height: 52px;
      padding: 0 10px 0 12px;
      display: flex;
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 8px 32px rgba(0,0,0,.45), inset 0 1px rgba(255,255,255,.08);
    }
    .marca { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font-weight: 700; }
    .marca img { width: 32px; height: 32px; border-radius: 9px; }
    .marca span { font-size: .92rem; letter-spacing: .02em; }
    .marca b { color: var(--teal); font-weight: 800; }
    .voltar {
      margin-left: auto;
      color: var(--teal);
      text-decoration: none;
      font-size: .82rem;
      font-weight: 700;
      padding: 8px 12px;
    }
    h1 { font-size: 1.7rem; margin: 0 0 8px; letter-spacing: -.02em; }
    .sub { color: var(--muted); margin: 0 0 20px; line-height: 1.45; font-size: .95rem; }
    .code-box {
      background: #111;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    .code-box small { color: var(--muted); font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .code {
      font: 800 1.7rem/1.2 ui-monospace, Consolas, monospace;
      letter-spacing: .28em;
      color: var(--teal);
      margin-top: 4px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
    .tabs button {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 14px;
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.75);
      font: 600 .86rem Inter, sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }
    .tabs button.on {
      color: #0b0f19;
      background: var(--teal);
      border-color: var(--teal);
      font-weight: 700;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }
    .painel { display: none; }
    .painel.on { display: block; }
    label { display: block; font-size: .78rem; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
    .painel.on label:first-child { margin-top: 0; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #0f0f0f;
      color: inherit;
      border-radius: 12px;
      padding: 12px 14px;
      font: 1rem Inter, sans-serif;
    }
    input:focus, textarea:focus { outline: 2px solid rgba(79,227,208,.45); border-color: var(--teal); }
    textarea { min-height: 92px; resize: vertical; }
    .hint { font-size: .8rem; color: var(--muted); margin: 10px 0 0; line-height: 1.4; }
    .ok {
      margin-top: 16px;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      font: 800 1rem Inter, sans-serif;
      background: var(--teal);
      color: #0b0f19;
      cursor: pointer;
    }
    .ok:disabled { opacity: .55; cursor: default; }
    .msg { margin-top: 14px; min-height: 1.4em; color: var(--teal); font-weight: 600; }
    .msg.err { color: #ff8b8b; }
    .nav-baixo {
      position: fixed; left: 0; right: 0; bottom: 0;
      z-index: 20;
      display: flex;
      justify-content: space-around;
      padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, transparent, #0a0a0a 28%);
      border-top: 1px solid var(--line);
      background-color: #0c0c0c;
    }
    .nav-baixo a {
      color: rgba(255,255,255,.55);
      text-decoration: none;
      font-size: .68rem;
      font-weight: 600;
      text-align: center;
      min-width: 56px;
    }
    .nav-baixo a.on { color: var(--teal); }
    .nav-baixo svg { display: block; margin: 0 auto 4px; width: 22px; height: 22px; }
  </style>
</head>
<body>
  <header class="barra-topo">
    <a class="marca" href="https://saimo-tv.pages.dev/">
      <img src="icon-512.png" alt="">
      <span>Saimo <b>TV</b></span>
    </a>
    <a class="voltar" href="https://saimo-tv.pages.dev/">Início</a>
  </header>

  <main class="wrap">
    <h1>Mandar para a TV</h1>
    <p class="sub">Xtream, link M3U ou arquivo. A TV precisa estar na tela do QR.</p>
    <div class="code-box">
      <small>Código da TV</small>
      <div class="code" id="codigo">------</div>
    </div>
    <div class="tabs">
      <button type="button" class="on" data-tab="xtream">Xtream</button>
      <button type="button" data-tab="link">Link M3U</button>
      <button type="button" data-tab="arquivo">Arquivo</button>
    </div>
    <div class="card">
      <div id="p-xtream" class="painel on">
        <label>Servidor</label>
        <input id="host" placeholder="http://seupainel.com" autocomplete="off">
        <label>Usuário</label>
        <input id="user" placeholder="login" autocomplete="username">
        <label>Senha</label>
        <input id="pass" type="password" placeholder="senha" autocomplete="current-password">
      </div>
      <div id="p-link" class="painel">
        <label>Link da lista</label>
        <textarea id="m3uurl" placeholder="http://…/get.php?username=… ou .m3u"></textarea>
        <p class="hint">Se for get.php do Xtream, a TV entra no painel. Lista enorme: prefira o Xtream.</p>
      </div>
      <div id="p-arquivo" class="painel">
        <label>Arquivo .m3u</label>
        <input id="arq" type="file" accept=".m3u,.m3u8,.txt">
        <p class="hint">No máximo 400 KB. Playlist grande não vai: use Xtream ou o link.</p>
      </div>
      <button class="ok" type="button" id="enviar">Enviar para a TV</button>
      <p class="msg" id="msg"></p>
    </div>
  </main>

  <nav class="nav-baixo" aria-label="Saimo TV">
    <a href="https://saimo-tv.pages.dev/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg>
      Início
    </a>
    <a href="https://saimo-tv.pages.dev/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
      Ao vivo
    </a>
    <a class="on" href="ligar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Ligar
    </a>
    <a href="https://saimo-tv.pages.dev/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 21h8"/></svg>
      Filmes
    </a>
  </nav>

<script>
(function () {
  var API = "https://raspy-sunset-1e1a.michellcosta1269.workers.dev";
  var code = (new URLSearchParams(location.search).get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  document.getElementById("codigo").textContent = code || "sem código";
  var tab = "xtream";
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.onclick = function () {
      tab = b.getAttribute("data-tab");
      document.querySelectorAll(".tabs button").forEach(function (x) { x.classList.toggle("on", x === b); });
      document.querySelectorAll(".painel").forEach(function (p) { p.classList.toggle("on", p.id === "p-" + tab); });
    };
  });
  function msg(t, err) {
    var el = document.getElementById("msg");
    el.textContent = t;
    el.className = "msg" + (err ? " err" : "");
  }
  function xtreamDoGet(url) {
    try {
      var u = new URL(url);
      var user = u.searchParams.get("username");
      var pass = u.searchParams.get("password");
      if (user && pass) return { tipo: "xtream", host: u.origin, user: user, pass: pass };
    } catch (e) {}
    return null;
  }
  document.getElementById("enviar").onclick = function () {
    if (!code) { msg("Abra esta página pelo QR da TV.", true); return; }
    if (tab === "xtream") {
      var host = document.getElementById("host").value.trim();
      var user = document.getElementById("user").value.trim();
      var pass = document.getElementById("pass").value;
      if (!host || !user || !pass) { msg("Preencha servidor, usuário e senha.", true); return; }
      if (!/^https?:\/\//i.test(host)) host = "http://" + host;
      ir({ tipo: "xtream", host: host, user: user, pass: pass });
      return;
    }
    if (tab === "link") {
      var u = document.getElementById("m3uurl").value.trim();
      if (!/^https?:\/\//i.test(u)) { msg("Cole um link http:// ou https://", true); return; }
      ir(xtreamDoGet(u) || { tipo: "m3u_url", url: u });
      return;
    }
    var f = document.getElementById("arq").files[0];
    if (!f) { msg("Escolha um arquivo .m3u", true); return; }
    if (f.size > 400 * 1024) { msg("Arquivo grande demais. Use Xtream ou o link.", true); return; }
    var r = new FileReader();
    r.onload = function () {
      var txt = String(r.result || "");
      var m = txt.match(/https?:\/\/[^\s"'<>]+get\.php\?[^\s"'<>]+/i);
      if (m) {
        var x = xtreamDoGet(m[0]);
        if (x) { ir(x); return; }
      }
      ir({ tipo: "m3u_txt", nome: f.name, texto: txt });
    };
    r.readAsText(f);
  };
  function ir(body) {
    msg("Enviando…");
    document.getElementById("enviar").disabled = true;
    fetch(API + "/v1/parear/" + encodeURIComponent(code), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (res) { return res.json().then(function (j) { return { res: res, j: j }; }); })
      .then(function (o) {
        if (!o.res.ok) throw new Error((o.j && o.j.error) || ("HTTP " + o.res.status));
        msg("Pronto. Olhe a TV.");
      })
      .catch(function (e) { msg(e.message || "Não enviou.", true); })
      .finally(function () { document.getElementById("enviar").disabled = false; });
  }
})();
</script>
</body>
</html>
